name: Lovdata container image

on:
  push:
    branches: [main]
    paths:
      - 'projects/lovdata/**'
      - '.github/workflows/lovdata-image.yml'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/altinn/team-kitt-lovdata

jobs:
  publish:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" projects/lovdata
      - name: Check container health
        run: |
          docker run --detach --name lovdata-smoke --publish 127.0.0.1:3000:3000 "${IMAGE}:${GITHUB_SHA}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:3000/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs lovdata-smoke || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: docker push "${IMAGE}:${GITHUB_SHA}"
